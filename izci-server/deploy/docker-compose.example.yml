# Example Compose setup: server behind Caddy, which terminates TLS and may
# also serve the izci frontend. Copy to docker-compose.yml and adjust paths.
#
# Container notes (differ from bare-metal defaults):
# - set "listen": "0.0.0.0:8787" in the mounted config.json;
# - point reverse_proxy at the compose service name (izci-server:8787), not
#   127.0.0.1, in the mounted Caddyfile;
# - add the Caddy container to trustedProxies if you need client IPs.

services:
  izci-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["serve", "--config", "/etc/izci-server/config.json"]
    volumes:
      - ./config.json:/etc/izci-server/config.json:ro
      - ./host-key:/etc/izci-server/host-key:ro
    expose:
      - "8787"

  # Optional TURN relay for restrictive NATs/firewalls. The static-auth
  # secret must match the server's relaySecretFile, and the server
  # config lists the relay in iceUrls (e.g. "turn:izci-server.example.com:3478").
  # See coturn.example.conf. Omit this service for direct-only setups.
  #
  # coturn:
  #   image: coturn/coturn:4.6-alpine
  #   command: ["-c", "/etc/coturn/turnserver.conf"]
  #   volumes:
  #     - ./coturn.conf:/etc/coturn/turnserver.conf:ro
  #   ports:
  #     - "3478:3478"
  #     - "3478:3478/udp"
  #     - "5349:5349"
  #   network_mode: host  # relay port ranges behave best on the host network

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      # Optional: serve the izci frontend from the same origin.
      # Build it with `npm run build` and mount dist/ here.
      # - ../../dist:/srv/izci:ro
    depends_on:
      - izci-server

volumes:
  caddy-data:
  caddy-config:
