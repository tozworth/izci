<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>libzci reference Opus player</title>
    <style>
      body { font: 13px/1.45 system-ui, sans-serif; margin: 8px; max-width: 1100px; }
      fieldset { margin: 8px 0; }
      h1 { font-size: 14px; margin: 0 0 4px; }
      p { margin: 4px 0 8px; }
      table { border-collapse: collapse; }
      td, th { border: 1px solid #999; padding: 2px 8px; text-align: left; }
      #diagnostics { white-space: pre-wrap; font-family: monospace; }
      button { margin-right: 6px; }
    </style>
  </head>
  <body>
    <h1>libzci reference Opus player</h1>
    <p>
      Reference libopusfile/Opus in a File worker, shared Rust transport and
      audio-only Rust worklet output. Transient session; no install or storage yet.
    </p>
    <fieldset>
      <legend>Source</legend>
      <input id="file" type="file" accept=".opus,.ogg,.oga" />
      <button id="open">Open</button>
      <button id="dispose">Dispose</button>
    </fieldset>
    <fieldset>
      <legend>Transport (engine commands)</legend>
      <button id="play">Play</button>
      <button id="pause">Pause</button>
      <button id="stop">Stop</button>
      <label>Seek (seconds): <input id="seek-seconds" type="number" value="0" min="0" step="0.1" /></label>
      <button id="seek">Seek</button>
      <label>Volume <input id="volume" type="range" min="0" max="1" step="0.01" value="1" /></label>
      <label><input id="mute" type="checkbox" /> Mute</label>
    </fieldset>
    <fieldset>
      <legend>Snapshot</legend>
      <table id="snapshot"></table>
    </fieldset>
    <fieldset>
      <legend>Decode and output diagnostics</legend>
      <table id="decode"></table>
    </fieldset>
    <fieldset>
      <legend>Diagnostics</legend>
      <div id="diagnostics">waiting…</div>
    </fieldset>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
