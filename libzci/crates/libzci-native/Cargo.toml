[package]
name = "libzci-native"
version = "0.1.0"
edition = "2021"
description = "Native adapter for libzci: file sources and minimal runtime assembly (no browser/device policy)."
license = "MIT"

[lib]
name = "libzci_native"
path = "src/lib.rs"

[dependencies]
libzci = { path = "../libzci" }
cpal = "0.18"
rtrb = "=0.4.0"
libzci-codecs = { path = "../libzci-codecs", optional = true }

[features]
provider-tests = ["dep:libzci-codecs"]

[[test]]
name = "providers_render"
required-features = ["provider-tests"]

[[test]]
name = "audible"
required-features = ["provider-tests"]
