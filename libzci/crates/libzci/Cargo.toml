[package]
name = "libzci"
version = "0.1.0"
edition = "2021"
description = "Reusable izci engine core: sessions, providers, and processing behind the core/adapter/consumer boundary."
license = "MIT"

[lib]
name = "libzci"
path = "src/lib.rs"

[dependencies]
rubato = "5"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[features]
default = ["control"]
control = ["dep:serde", "dep:serde_json"]
