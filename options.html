<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="izci Options controls module playback defaults and metadata behavior."
    />
    <meta name="theme-color" content="#1c1d1e" />
    <link rel="icon" href="/icons/izci-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/izci-icon.svg" />
    <title>izci Options</title>
    <script>
      (() => {
        const root = document.documentElement;
        const themeBackgrounds = {
          gray: '#18191b',
          coal: '#101113',
          'lights-out': '#000000',
          nordic: '#1b222d',
          gruvbox: '#1d2021',
          dracula: '#171922',
          ember: '#1a1010'
        };
        const themeColors = {
          gray: '#18191b',
          coal: '#101113',
          'lights-out': '#000000',
          nordic: '#1b222d',
          gruvbox: '#1c1d1e',
          dracula: '#1f2029',
          ember: '#1c1110'
        };
        let theme = 'gray';
        let background = themeBackgrounds.gray;
        let themeColor = themeColors.gray;

        try {
          const rawSettings = window.localStorage.getItem('izci.appearance-settings');
          const settings = rawSettings ? JSON.parse(rawSettings) : null;
          const savedTheme = settings?.colorTheme;

          if (savedTheme === 'chameleon') {
            const savedHue = Number(settings?.chameleonHue);
            const savedSaturation = Number(settings?.chameleonSaturation);
            const hue = Number.isFinite(savedHue)
              ? Math.min(Math.max(Math.round(savedHue), 0), 359)
              : 210;
            const saturation = Number.isFinite(savedSaturation)
              ? Math.min(Math.max(Math.round(savedSaturation), 0), 100)
              : 76;
            const surfaceSaturation = Math.round(saturation * 0.32);
            theme = savedTheme;
            background = `hsl(${hue} ${surfaceSaturation}% 9%)`;
            themeColor = `hsl(${hue} ${surfaceSaturation}% 11%)`;
          } else if (Object.hasOwn(themeBackgrounds, savedTheme)) {
            theme = savedTheme;
            background = themeBackgrounds[theme];
            themeColor = themeColors[theme];
          }
        } catch {
          theme = 'gray';
        }

        root.dataset.theme = theme;
        root.style.setProperty('--initial-background', background);

        const themeColorMeta = document.querySelector('meta[name="theme-color"]');
        if (themeColorMeta) {
          themeColorMeta.setAttribute('content', themeColor);
        }
      })();
    </script>
    <style>
      :root {
        color-scheme: dark;
        --initial-background: #18191b;
        background: var(--initial-background);
      }

      html,
      body,
      #app {
        min-height: 100%;
        margin: 0;
        background-color: var(--initial-background);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/options/main.ts"></script>
  </body>
</html>
