# Example coturn config for relaying izci sidekick calls. Copy to
# /etc/turnserver.conf (or mount it into a coturn container) and adjust the
# realm, ports, and secret path. The secret MUST match the file pointed at
# by relaySecretFile in the sidekick config: the sidekick issues standard
# TURN REST shared-secret credentials (username "expiry:opaque", password
# base64(HMAC-SHA1(secret, username))) with a 10-minute default lifetime,
# and izci refreshes them before renegotiating.
#
# Without a relay, direct peer-to-peer ICE is attempted first and usually
# succeeds on the same LAN or with friendly NATs. Enable a relay when
# guests sit behind symmetric NATs or restrictive firewalls, or when the
# operator turns on relay-only mode in izci (which then requires a relay
# and fails with a plain error if none is configured).

listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0
realm=sidekick.example.com
server-name=sidekick.example.com

# Shared secret for TURN REST; same value as the sidekick's relaySecretFile.
# Generate with: openssl rand -hex 32
use-auth-secret
static-auth-secret="<shared secret from the relay secret file>"

# Keep relay allocations tight: izci calls are audio plus data channels.
max-bps=1000000
bps-capacity=0
stale-nonce=600
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=240.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# TLS for turns: (Let Caddy or your reverse proxy terminate TLS instead for
# the sidekick API; coturn needs its own cert files only for turns:.)
# cert=/etc/turnserver/fullchain.pem
# pkey=/etc/turnserver/privkey.pem

log-file=/var/log/turnserver.log
syslog
