[package]
name = "izci"
version = "0.4.0"
edition = "2021"
publish = false

[features]
default = []
builtin-signaling = ["dep:getrandom", "dep:reqwest", "dep:tokio", "dep:tokio-tungstenite", "dep:futures-util", "windows/Win32_System_JobObjects", "windows/Win32_System_Threading", "windows/Win32_Security"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2.12", default-features = false, features = ["wry", "compression", "common-controls-v6", "tray-icon"] }
tauri-plugin-single-instance = "2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
webview2-com = "0.39"
getrandom = { version = "0.3", optional = true }
reqwest = { version = "0.13", default-features = false, optional = true }
tokio = { version = "1", features = ["sync", "time", "macros", "net"], optional = true }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"], optional = true }
futures-util = { version = "0.3", features = ["sink"], optional = true }
winreg = "0.55"
windows = { version = "0.62", features = ["Win32_Graphics_DirectWrite", "Win32_Graphics_Dwm", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# Keep Windows debug symbols and incremental caches from dominating the workspace.
[profile.dev]
debug = 0
incremental = false

[profile.release]
opt-level = "z"
codegen-units = 1
lto = "fat"
panic = "abort"
strip = true
