[package]
name = "izci"
version = "0.3.2"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.12", default-features = false, features = ["wry", "compression", "common-controls-v6", "tray-icon"] }
tauri-plugin-single-instance = "2"
serde_json = "1"
webview2-com = "0.39"
winreg = "0.55"
windows = { version = "0.62", features = ["Win32_Graphics_DirectWrite", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = "z"
codegen-units = 1
lto = "fat"
panic = "abort"
strip = true
