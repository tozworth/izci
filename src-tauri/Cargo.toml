[package]
name = "izci"
version = "0.3.2"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2.6", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2.12", default-features = false, features = ["wry", "compression", "common-controls-v6", "tray-icon"] }
tauri-plugin-single-instance = "2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
webview2-com = "0.39"
getrandom = "0.3"
reqwest = { version = "0.13", default-features = false }
tokio = { version = "1", features = ["sync", "time", "macros", "net"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
futures-util = { version = "0.3", features = ["sink"] }
winreg = "0.55"
windows = { version = "0.62", features = ["Win32_Graphics_DirectWrite", "Win32_Graphics_Dwm", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[profile.release]
opt-level = "z"
codegen-units = 1
lto = "fat"
panic = "abort"
strip = true
